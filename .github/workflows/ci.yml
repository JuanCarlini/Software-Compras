name: CI

# El repo ya tenía las reglas duras de seguridad escritas como tests que rompen el build
# (src/app/api/route-authz.test.ts y src/app/(dashboard)/page-authz.test.ts), pero nadie las
# ejecutaba automáticamente: corrían solo si un humano se acordaba de tipear `npm test`.
# Este workflow convierte esa convención de honor en un gate real (auditoría CN-012).

on:
  push:
    branches: [main, dev]
  pull_request:

# Least privilege: el job solo lee el código. Sin esto, el token hereda permisos de
# escritura sobre el repo y cualquier step comprometido podría pushear.
permissions:
  contents: read

concurrency:
  # Un push nuevo cancela la corrida anterior de la misma rama/PR.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pineadas por SHA COMPLETO, no por tag: un tag es mutable y quien controle
      # el repo de la action puede reapuntarlo a código malicioso. El comentario deja
      # legible qué versión es cada SHA.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # `npm ci` y no `npm install`: instala exactamente lo que dice el lock file y falla
      # si package.json y el lock divergen.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # Acá corren las dos reglas duras de autorización, además de los tests de dominio.
      - name: Tests
        run: npm test

      # Backstop de dependencias. Hoy el proyecto está en 0 vulnerabilidades; este step
      # existe para que un advisory nuevo se vea el día que sale y no meses después
      # (fue exactamente lo que pasó: 29 advisories de Next acumulados en silencio).
      - name: Audit de dependencias
        run: npm audit --audit-level=high

      # Último porque es el más lento: si algo más simple ya falló, no gastamos el build.
      - name: Build
        run: npm run build
